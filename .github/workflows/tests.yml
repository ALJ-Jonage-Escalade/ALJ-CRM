name: Tests

# On main, these tests run through deploy-cloud-run.yml (which deploys only if they pass).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: 'code_source/.python-version'

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.1"
        enable-cache: true
        cache-dependency-glob: code_source/uv.lock

    - name: Install system libraries (WeasyPrint)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0

    - name: Install Dependencies (uv.lock)
      working-directory: code_source
      env:
        UV_PYTHON_PREFERENCE: only-system # use the interpreter installed above
      run: uv sync --frozen

    - name: Check lock and exported requirements are up to date
      working-directory: code_source
      run: |
        uv lock --check
        python dev/export_requirements.py --check

    - name: Check the API contract (frontend/openapi.json) is up to date
      working-directory: code_source
      run: uv run --no-sync python dev/export_openapi.py --check

    - name: Lint (ruff)
      working-directory: code_source
      # github format: findings show as annotations in the PR "Files changed" tab (security rules S included)
      run: uv run --no-sync ruff check src tests --output-format=github

    - name: Type check (mypy)
      working-directory: code_source
      run: uv run --no-sync mypy

    - name: Run Unit Tests (pytest)
      working-directory: code_source
      # Coverage report without a threshold (as the frontend job); -rs lists the reasons of skipped tests
      run: uv run --no-sync pytest tests --cov=src --cov-branch --cov-report=term -rs

  frontend:
    # Vue app (code_source/frontend/): same commands as locally, Node version from .nvmrc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code_source/frontend
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: 'code_source/frontend/.nvmrc'
        cache: 'npm'
        cache-dependency-path: code_source/frontend/package-lock.json

    - name: Install Dependencies (package-lock.json)
      run: npm ci --no-fund

    - name: Audit runtime dependencies (npm audit)
      run: npm audit --omit=dev --audit-level=high

    - name: Audit dev dependencies (npm audit, informational)
      # Build and test tools only: reported here, fixed through Dependabot, does not block
      continue-on-error: true
      run: npm audit --audit-level=high

    - name: Check the API types match the contract (src/lib/api-schema.ts)
      run: npm run check:api

    - name: Lint (ESLint)
      run: npm run lint

    - name: Format check (Prettier)
      run: npm run format:check

    - name: Type check (vue-tsc)
      run: npm run typecheck

    - name: Unit Tests with coverage summary (Vitest)
      run: npm run test:coverage

    - name: Build
      run: npm run build

  security:
    # Semgrep CE with the open-source rules (Python + TypeScript/Vue): replaces CodeQL, which needs the
    # paid GitHub Code Security on a private repository. Output in the job log only (SARIF upload needs it too).
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.1"

    - name: Scan (Semgrep)
      # Engine pinned; the p/ rule sets come from the registry and can gain rules over time.
      # False positive: `# nosemgrep: <rule-id>` on the line, with the reason in a comment above it
      run: >
        uvx semgrep@1.182.1 scan --config p/python --config p/typescript --config p/owasp-top-ten
        --metrics=off --error --exclude code_source/frontend/src/lib/api-schema.ts
        code_source/src code_source/frontend/src

  e2e:
    # Browser tests (Playwright) against a throwaway stack started by the tests: Firebase emulator +
    # Mailpit (code_source/e2e/docker-compose.yml), fake data, fake HelloAsso, server in dev mode.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: code_source
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Restore e2e stack images
      # Building them takes a minute. Tests run on main too (deploy-cloud-run.yml), so its cache serves every PR.
      id: e2e-images
      uses: actions/cache@v6
      with:
        path: ~/e2e-images.tar
        key: e2e-images-${{ runner.os }}-${{ hashFiles('code_source/dev/emulator/Dockerfile', 'code_source/e2e/docker-compose.yml') }}

    - name: Load e2e stack images from the cache
      if: steps.e2e-images.outputs.cache-hit == 'true'
      run: docker load --input ~/e2e-images.tar

    - name: Prepare e2e stack images (Firebase emulator + Mailpit)
      # Built/pulled up front so that a failure shows here; the tests start the stack themselves.
      if: steps.e2e-images.outputs.cache-hit != 'true'
      run: |
        docker compose -f e2e/docker-compose.yml build
        docker compose -f e2e/docker-compose.yml pull mailpit
        docker save --output ~/e2e-images.tar $(docker compose -f e2e/docker-compose.yml config --images)

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: 'code_source/.python-version'
        cache: 'pip'

    - name: Install system libraries (WeasyPrint)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-docker.txt -r requirements-e2e.txt

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('code_source/requirements-e2e.txt') }}

    - name: Install Chromium
      run: python -m playwright install --with-deps chromium

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: 'code_source/frontend/.nvmrc'
        cache: 'npm'
        cache-dependency-path: code_source/frontend/package-lock.json

    - name: Build the Vue app (served by the server under test)
      working-directory: code_source/frontend
      run: npm ci --no-fund && npm run build

    - name: Lint (ruff)
      run: python -m ruff check e2e --output-format=github

    - name: Run e2e tests (pytest + Playwright)
      id: e2e-tests
      # Below the job's 30 min: a hung run fails here, so the logs and artifacts below are still uploaded
      timeout-minutes: 20
      env:
        E2E_KEEP_STACK: '1' # kept for the re-run and the logs below, removed by the last step
      # No tracing here: it records every test, about 20 % slower. The next step traces the failures.
      # -vv (addopts has -q): names each test as it ends ([gw0] PASSED ...), so a worker that dies points to the test it was running.
      # --max-worker-restart=0: a dead worker stops the run with "worker gwN crashed while running <test>"; restarting
      # it left xdist waiting until the step timeout (worker "node down: Not properly terminated").
      run: >
        python -m pytest -c e2e/pytest.ini e2e -vv --max-worker-restart=0
        --output e2e-results --screenshot only-on-failure

    - name: Re-run failed e2e tests with tracing
      # Diagnosis only: the job stays red even if they pass this time (flaky), and their traces are kept either way.
      # --last-failed-no-failures none: nothing to re-run when the run above was killed before saving its failures.
      if: failure() && steps.e2e-tests.outcome == 'failure'
      timeout-minutes: 10
      env:
        E2E_KEEP_STACK: '1'
      run: >
        python -m pytest -c e2e/pytest.ini e2e -vv --max-worker-restart=0
        --last-failed --last-failed-no-failures none
        --output e2e-results/rerun --tracing on --screenshot only-on-failure

    - name: e2e stack logs
      if: failure() || cancelled()
      run: mkdir -p e2e-results && docker compose -f e2e/docker-compose.yml logs --no-color > e2e-results/docker-compose.log 2>&1

    - name: Kernel log (out-of-memory kills)
      if: failure() || cancelled()
      run: sudo dmesg -T | grep -iE "out of memory|killed process|oom" || echo "No out-of-memory kill"

    - name: Upload e2e artifacts
      if: failure() || cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-results
        path: code_source/e2e-results/
        retention-days: 7

    - name: Stop e2e stack
      if: always()
      run: docker compose -f e2e/docker-compose.yml down
