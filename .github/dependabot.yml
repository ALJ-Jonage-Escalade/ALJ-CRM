version: 2
updates:
  # Dépendances Python : pyproject.toml + uv.lock (code_source/)
  - package-ecosystem: "uv"
    directory: "/code_source"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # Dépendances npm : package.json + package-lock.json (application Vue), versions exactes conservées
  - package-ecosystem: "npm"
    directory: "/code_source/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Versions liées (@vitest/coverage-v8 exige la même version exacte de vitest), majeures comprises
      vitest:
        patterns: ["vitest", "@vitest/coverage-v8"]
      # Une seule PR pour les mises à jour mineures et correctives de la semaine
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
