[project]
name = "alj-escalade-manager"
version = "2.0.5"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "requests==2.34.2",
    "PyJWT[crypto]==2.15.1",
    # Imported directly (x509 certificates of the Firebase tokens), not only through PyJWT[crypto]
    "cryptography==50.0.2",
    # API contract models: imported directly, not only through fastapi
    "pydantic==2.14.3",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.4",
    "pillow==13.0.0",
    "lxml==6.1.3",
    "segno==1.6.6",
    # Attestation PDFs (needs Pango from the system, installed by the Dockerfile)
    "weasyprint==70.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "httpx==0.28.1",
    # Fake data for the development environment (dev/seed)
    "Faker==40.39.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
# Arborescence plate src/ : pas un paquet installable.
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Les tests sont des classes unittest : pytest les exécute nativement.
addopts = "-q"

[tool.ruff]
line-length = 140
exclude = ["build", "dist"]

[tool.ruff.lint]
# Démarrage progressif : erreurs d'exécution + imports/variables inutilisés.
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
    "B008",  # injections de dépendances FastAPI (Body(...) en défaut)
    "B904",  # raise ... from : chantier séparé
    "B007",  # variables de boucle inutilisées (patterns UI existants)
    "B023",  # closures de boucle volontaires (event loops synchrones, callbacks par itération)
    "E701",  # style historique : instruction simple après deux-points
    "E402",  # imports après configuration sys.path (structure des entry points du projet)
]

[tool.ruff.lint.per-file-ignores]
# Règles de sécurité (S) : les tests utilisent assert, de faux secrets, un RNG à graine fixe,
# du SQL de vérification et urlopen vers l'émulateur local.
"tests/**" = ["S101", "S105", "S310", "S311", "S608"]
# e2e : assert Playwright, faux jeton de webhook, subprocess docker à argv fixe, urlopen vers la pile locale.
"e2e/**" = ["S101", "S105", "S310", "S603"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["tests", "build", "dist"]
# Modules imported as the app imports them (src/ on the path: domain.x, services.x…)
mypy_path = "src"
explicit_package_bases = true
files = ["src"]
